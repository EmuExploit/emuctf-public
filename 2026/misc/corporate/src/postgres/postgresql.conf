listen_addresses = '*'
logging_collector = on
log_destination = 'stderr'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%a.log'
log_rotation_age = '1d'
log_rotation_size = 0
log_truncate_on_rotation = on
log_line_prefix = '%m [%p] %u@%d '
# Seven daily log files; SQL statements and submitted content are not logged.

# Leave room for tmpfs data/WAL and backend processes in the 1 GiB container.
max_connections = 40
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 32MB
