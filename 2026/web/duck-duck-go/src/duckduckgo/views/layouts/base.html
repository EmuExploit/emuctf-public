<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - DuckDuckGo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --ink: #0e0e0e;
        --ink-soft: #555;
        --surface: #f7f5f0;
        --panel: #fff;
        --accent: #c84b31;
        --accent-dark: #a03825;
        --accent-ghost: rgba(200,75,49,0.08);
        --border: #e0ddd7;
        --radius: 4px;
        --green: #2e7d32;
        --green-bg: #f0faf0;
        --red-bg: #fff5f5;
      }

      /* ── typography & base ── */
      body {
        font-family: 'DM Sans', sans-serif;
        background: var(--surface);
        min-height: 100vh;
        color: var(--ink);
      }

      /* ── centered card layout (auth pages) ── */
      body.auth-layout {
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 3rem 2.5rem;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      }

      /* ── app layout (authenticated pages) ── */
      body.app-layout {
        display: flex;
        flex-direction: column;
      }
      nav {
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        padding: 0 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 56px;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .nav-brand {
        font-family: 'DM Serif Display', serif;
        font-size: 1.3rem;
        color: var(--ink);
        text-decoration: none;
      }
      .nav-links {
        display: flex;
        align-items: center;
        gap: 0.25rem;
      }
      .nav-links a {
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--ink-soft);
        text-decoration: none;
        padding: 0.4rem 0.75rem;
        border-radius: var(--radius);
        transition: background 0.15s, color 0.15s;
      }
      .nav-links a:hover { background: var(--accent-ghost); color: var(--accent); }
      .nav-links a.active { color: var(--accent); background: var(--accent-ghost); }
      .nav-links .nav-logout {
        color: var(--ink-soft);
        border: 1px solid var(--border);
        margin-left: 0.5rem;
      }
      .nav-links .nav-logout:hover { border-color: var(--accent); }
      main {
        flex: 1;
        padding: 2.5rem 2rem;
        max-width: 900px;
        width: 100%;
        margin: 0 auto;
      }

      /* ── shared components ── */
      .logo { font-family: 'DM Serif Display', serif; font-size: 2rem; color: var(--ink); margin-bottom: 0.25rem; }
      .tagline { font-size: 0.875rem; color: var(--ink-soft); margin-bottom: 2.5rem; }

      .flash {
        background: var(--green-bg);
        border-left: 3px solid var(--green);
        padding: 0.75rem 1rem;
        border-radius: 4px;
        margin-bottom: 1.5rem;
        font-size: 0.875rem;
        color: var(--green);
      }
      .errors {
        background: var(--red-bg);
        border-left: 3px solid var(--accent);
        padding: 0.75rem 1rem;
        border-radius: 4px;
        margin-bottom: 1.5rem;
      }
      .errors li { color: #8b2020; font-size: 0.875rem; list-style: none; padding: 0.1rem 0; }

      .field { margin-bottom: 1.25rem; }
      label {
        display: block;
        font-size: 0.8rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin-bottom: 0.4rem;
      }
      input[type="username"],
      input[type="password"],
      input[type="text"],
      input[type="number"],
      input[type="url"] {
        width: 100%;
        padding: 0.7rem 0.9rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 0.95rem;
        color: var(--ink);
        background: var(--surface);
        transition: border-color 0.15s, box-shadow 0.15s;
        outline: none;
      }
      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(200,75,49,0.12);
      }
      .btn {
        display: inline-flex; align-items: center; gap: 0.4rem;
        padding: 0.7rem 1.4rem;
        background: var(--accent); color: #fff;
        font-family: inherit; font-size: 0.9rem; font-weight: 500;
        border: none; border-radius: var(--radius); cursor: pointer;
        transition: background 0.15s; text-decoration: none;
      }
      .btn:hover { background: var(--accent-dark); }
      .btn-block { display: flex; width: 100%; justify-content: center; margin-top: 1.5rem; }
      .btn-ghost {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--accent);
      }
      .btn-ghost:hover { background: var(--accent-ghost); }
      .btn-danger {
        background: transparent;
        color: #8b2020;
        border: 1px solid #e0b0b0;
        font-size: 0.8rem;
        padding: 0.35rem 0.7rem;
      }
      .btn-danger:hover { background: var(--red-bg); }
      .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }

      .foot { text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--ink-soft); }
      .foot a { color: var(--accent); text-decoration: none; font-weight: 500; }
      .foot a:hover { text-decoration: underline; }
      .hint { font-size: 0.78rem; color: var(--ink-soft); margin-top: 0.3rem; }

      /* ── page header ── */
      .page-header { margin-bottom: 2rem; }
      .page-header h1 {
        font-family: 'DM Serif Display', serif;
        font-size: 1.75rem;
        font-weight: 400;
        color: var(--ink);
      }
      .page-header p { font-size: 0.9rem; color: var(--ink-soft); margin-top: 0.25rem; }

      /* ── section panels ── */
      .section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.75rem 2rem;
        margin-bottom: 1.5rem;
      }
      .section-title {
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin-bottom: 1.25rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid var(--border);
      }

      /* ── table ── */
      .tbl { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
      .tbl th {
        text-align: left;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--ink-soft);
        padding: 0.6rem 0.75rem;
        border-bottom: 1px solid var(--border);
      }
      .tbl td {
        padding: 0.75rem;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      .tbl tr:last-child td { border-bottom: none; }
      .tbl tr:hover td { background: var(--surface); }

      /* ── badges ── */
      .badge {
        display: inline-block;
        font-size: 0.72rem;
        font-weight: 500;
        padding: 0.2rem 0.55rem;
        border-radius: 99px;
        letter-spacing: 0.03em;
      }
      .badge-green { background: var(--green-bg); color: var(--green); }
      .badge-gray { background: var(--surface); color: var(--ink-soft); border: 1px solid var(--border); }
      .badge-red { background: var(--red-bg); color: #8b2020; }

      /* ── tag input ── */
      .tag-list { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.5rem; }
      .tag {
        display: inline-flex; align-items: center; gap: 0.3rem;
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 99px; padding: 0.25rem 0.7rem;
        font-size: 0.82rem; color: var(--ink);
      }
      .tag button {
        background: none; border: none; cursor: pointer;
        color: var(--ink-soft); font-size: 0.9rem; line-height: 1;
        padding: 0; transition: color 0.1s;
      }
      .tag button:hover { color: var(--accent); }

      /* ── empty state ── */
      .empty {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--ink-soft);
        font-size: 0.9rem;
      }
      .empty strong { display: block; font-size: 1rem; color: var(--ink); margin-bottom: 0.5rem; }
    </style>
  </head>
  <body class="{{.LayoutDesign}}">
    {{.LayoutContent}}
  </body>
</html>
