services:
  app:
    image: ${REGISTRY}/duck-duck-go:latest
    build:
      context: ./src
    environment:
      HOME: /tmp
      GOMAXPROCS: "2"
      FLAG: ${FLAG}
      POSTGRES_USER: ddgu
      POSTGRES_PASSWORD: 620af28e3aa19b7b5ab44f6f4a020307fdd498992061490ed8021a170a8e0790
      POSTGRES_DB: ddgdb
    networks:
      - internal
    expose:
      - "8080"
    read_only: true
    tmpfs:
      /var/lib/postgresql/data: "rw,uid=70,gid=70,mode=0700"
      /run/postgresql: "rw,uid=70,gid=70,mode=0775"
      /user-scans: "rw,mode=0755"
      /tmp: "rw,mode=1777"
      /etc/chromium: "rw,mode=0755"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    shm_size: "256m"
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 1024

networks:
  internal:
    internal: false
