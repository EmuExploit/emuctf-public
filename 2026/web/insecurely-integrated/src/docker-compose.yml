name: emu-most-wanted

services:
  app:
    build: .
    image: insecurely-integrated-local
    container_name: insecurely-integrated-local
    ports:
      - "${PORT:-8080}:8080"
    environment:
      flag: ${FLAG:-EMU{real_flag_on_deployed}}
    init: true
    restart: unless-stopped
    read_only: true
    mem_limit: 128m
    pids_limit: 128
    cpus: 0.5
