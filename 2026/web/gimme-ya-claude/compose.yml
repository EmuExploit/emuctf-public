services:
  app:
    image: ${REGISTRY}/gimme-ya-claude:latest
    build:
      context: ./src
    environment:
      flag: ${FLAG}
    expose:
      - "8080"
    read_only: true
    user: "0:0"
    tmpfs:
      /secret: "rw,nosuid,nodev,mode=0711"
      /tmp: "rw,exec,nosuid,nodev,mode=1777"
      /app/tmp: "rw,nosuid,nodev,uid=1001,gid=1001,mode=0755"
      /app/log: "rw,nosuid,nodev,uid=1001,gid=1001,mode=0755"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt: []
    networks:
      - internet
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 256

networks:
  internet:
    internal: false
