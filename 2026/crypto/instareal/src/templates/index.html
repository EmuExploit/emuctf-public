<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InstaReal / join</title>
  <style>
    :root{font-family:Georgia,serif;color:#17221f;background:#f4efe5}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 12%,#f8c7a6 0 11%,transparent 30%),radial-gradient(circle at 92% 84%,#b7d8c8 0 13%,transparent 32%),#f4efe5}
    nav{display:flex;align-items:center;padding:25px max(24px,calc((100vw - 1180px)/2));font-family:Arial,sans-serif}.brand{font-size:1.55rem;font-weight:800;letter-spacing:-.05em}.brand em{color:#eb603b;font-style:normal}
    .shell{width:min(1180px,calc(100% - 48px));margin:5vh auto 8vh;display:grid;grid-template-columns:1.15fr .85fr;gap:8vw;align-items:center}.kicker{font:700 .75rem Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#eb603b}.hero h1{font-size:clamp(3.6rem,8vw,7.8rem);line-height:.84;letter-spacing:-.07em;margin:20px 0 28px}.hero p{font-size:1.25rem;line-height:1.35;max-width:460px;margin-bottom:36px}.button{display:inline-block;padding:14px 21px;border-radius:99px;background:#17221f;color:#f8f3e8;text-decoration:none;font:700 .9rem Arial,sans-serif;border:0;cursor:pointer;transition:transform .2s,background .2s}.button:hover{background:#eb603b;transform:translateY(-2px)}.button:focus-visible{outline:2px solid #eb603b;outline-offset:3px}.button.alt{background:transparent;color:#17221f;border:1px solid #17221f}
    .signup{background:#fffaf0;border:1px solid #d6cec0;padding:30px;box-shadow:10px 12px 0 #e8d8c7;transform:rotate(1.5deg)}.signup h2{font-size:2rem;letter-spacing:-.05em;margin:0 0 8px}.signup p{font:14px Arial,sans-serif;color:#66716d;margin:0 0 22px}.field{display:block;font:700 .75rem Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;margin:15px 0}.field input{display:block;width:100%;margin-top:7px;padding:13px;border:1px solid #c8c0b3;background:#f8f3e9;font:16px Arial,sans-serif;color:#17221f}.field input::placeholder{color:#8e867b}.field input[type="date"]{color:#8e867b;cursor:pointer}.field input[type="date"]::-webkit-calendar-picker-indicator{cursor:pointer}.field input[type="date"]::-webkit-datetime-edit{color:inherit}.field input[type="date"]:focus,.field input[type="date"]:valid{color:#17221f}.field input:focus{outline:2px solid #eb603b;outline-offset:2px}.field input:user-invalid{border-color:#b83828;background:#fbe9e4}.field small{display:block;margin-top:7px;color:#66716d;font:12px/1.35 Arial,sans-serif;font-weight:400;letter-spacing:0;text-transform:none}.signup button{width:100%;margin-top:8px}.error{font:700 .86rem Arial,sans-serif;color:#b83828}.footnote{display:flex;align-items:center;gap:6px;font:13px Arial,sans-serif;color:#66716d;margin-top:18px}.footnote a{display:inline-flex;align-items:center;padding:8px 12px;border:1px solid #17221f;border-radius:99px;color:#17221f;text-decoration:none;font-weight:700;transition:transform .2s,background .2s,color .2s}.footnote a:hover{background:#17221f;color:#f8f3e8;transform:translateY(-2px)}.footnote a:focus-visible{outline:2px solid #eb603b;outline-offset:3px}
    @media(max-width:760px){.shell{grid-template-columns:1fr;margin-top:3vh;gap:48px}.hero h1{font-size:clamp(4rem,18vw,6rem)}nav{padding:20px 24px}}
  </style>
</head>
<body>
  <nav><div class="brand">Insta<em>Real</em></div></nav>
  <main class="shell">
    <section class="hero"><div class="kicker">A little corner of the internet</div><h1>Keep scrolling.<br>Stay inspired.</h1><p>Inspirational quotes, fresh perspective, and words worth returning to when you need them.</p></section>
    <section class="signup"><h2>Make an entrance.</h2><p>Join InstaReal, one good thought at a time.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" action="{{ url_for('auth.signup') }}"><label class="field">Username<input name="username" required placeholder="Choose a username" autocomplete="username"></label><label class="field">Password<input name="password" type="password" required placeholder="Create a password" autocomplete="new-password"></label><button class="button" type="submit">Create account →</button></form><div class="footnote">Already here? <a href="{{ url_for('auth.login') }}">Log in</a></div></section>
  </main>
</body>
</html>
