<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InstaReal / explore</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#f8f2e8;background:#080b0a}*{box-sizing:border-box}html{scroll-snap-type:y mandatory;scroll-behavior:smooth;scroll-padding:0;overscroll-behavior-y:contain}html,body{margin:0;min-height:100%;background:#080b0a}body{overflow-x:hidden}.topbar{position:fixed;z-index:5;top:0;left:0;right:0;height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:linear-gradient(#080b0acc,transparent);pointer-events:none}.brand,.top-actions{pointer-events:auto}.brand{font:bold 1.65rem Georgia,serif;letter-spacing:-.07em;text-decoration:none;color:#fff}.brand em{color:#f18a5c;font-style:normal}.top-actions{display:flex;align-items:center;gap:10px}.top-action{position:relative;display:grid;place-items:center;width:42px;height:42px;border:1px solid #ffffff3d;border-radius:50%;background:#080b0a8c;color:#fff;text-decoration:none;cursor:pointer;backdrop-filter:blur(8px);transition:background .2s,transform .2s}.top-action:hover{background:#f18a5c;transform:translateY(-2px)}.top-action:focus-visible{outline:2px solid #ffd2b8;outline-offset:3px}.profile-icon{width:15px;height:15px;border:2px solid currentColor;border-radius:50%;position:relative;margin-top:-8px}.profile-icon:after{content:"";position:absolute;width:20px;height:10px;border:2px solid currentColor;border-bottom:0;border-radius:12px 12px 0 0;left:50%;top:16px;transform:translateX(-50%)}.upload-icon{font-size:1.35rem;line-height:1}.upload-form{margin:0}.upload-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.top-action[aria-label]{font-size:0}.top-action[aria-label]::before{font-size:1rem}.feed{scroll-behavior:smooth}.real{height:100vh;min-height:560px;scroll-snap-align:start;scroll-snap-stop:always;position:relative;isolation:isolate;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}.visual{position:absolute;z-index:-2;inset:0;background:var(--art)}.visual:before{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(115deg,transparent 0 42px,#ffffff14 43px 45px),radial-gradient(circle at 68% 28%,#fff5 0 1px,transparent 2px);transform:rotate(var(--tilt));animation:drift 18s linear infinite}.visual:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0008 0%,transparent 24%,transparent 51%,#000c 100%)}@keyframes drift{to{transform:rotate(var(--tilt)) translate(5%,3%)}}
    .real-content{width:min(1120px,100%);height:100%;padding:0 96px 70px 28px;display:flex;align-items:flex-end}.copy{max-width:530px;text-shadow:0 2px 18px #0008}.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#ffd2b8}.copy h1{font:normal clamp(2.4rem,6vw,5.6rem)/.87 Georgia,serif;letter-spacing:-.07em;margin:12px 0 18px}.copy p{font-size:1rem;line-height:1.45;color:#e5e3d9;margin:0 0 18px}.creator{font-size:.8rem;font-weight:700}.actions{position:absolute;right:24px;bottom:72px;display:flex;flex-direction:column;align-items:center;gap:22px}.action{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;border:0;background:transparent;padding:0;cursor:pointer;font-size:.72rem;font-weight:700;text-shadow:0 2px 8px #000}.icon{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#0007;backdrop-filter:blur(8px);font-size:1.45rem;text-shadow:none}.action:hover .icon,.action.active .icon{transform:scale(1.1);background:#f18a5c}.action.active .icon{color:#20140f}.loading{height:100vh;display:grid;place-items:center;color:#c5cec7}.hint{position:fixed;z-index:4;right:28px;top:90px;color:#ffffff99;font-size:.7rem;writing-mode:vertical-rl;letter-spacing:.12em;text-transform:uppercase}@media(max-width:600px){.topbar{padding:0 18px}.real-content{padding:0 82px 62px 20px}.actions{right:14px;bottom:66px}.icon{width:44px;height:44px}.hint{display:none}}
    html,body{height:100%;overflow:hidden!important}#feed{height:100vh;max-width:100vw;width:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;scroll-snap-type:y mandatory;scroll-behavior:smooth}#feed::-webkit-scrollbar{display:none}.real,.visual{max-width:100vw;width:100%;overflow:hidden}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="{{ url_for('real.real_root') }}">Insta<em>Real</em></a><div class="top-actions"><a class="top-action" href="{{ url_for('profile.profile_page') }}" aria-label="View my posted Reals" title="My posted Reals"><span class="profile-icon" aria-hidden="true"></span></a></div></header>
  <main id="feed" class="feed" data-initial-real-id="{{ initial_real_id }}"><div class="loading">Loading your next Real...</div></main><div class="hint">scroll for perspective</div>
  <script src="{{ url_for('static', filename='client.js') }}" defer></script>
</body>
</html>
