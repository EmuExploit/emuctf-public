<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InstaReal / post a Real</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#f8f2e8;background:#101512}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 12%,#f18a5c2b,transparent 28%),radial-gradient(circle at 12% 90%,#8ab8a52b,transparent 32%),#101512}.shell{width:min(640px,calc(100% - 48px));margin:auto;padding:48px 0 64px}.brand{font:bold 1.65rem Georgia,serif;letter-spacing:-.07em;text-decoration:none;color:#fff}.brand em{color:#f18a5c;font-style:normal}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:48px}.back{color:#f8f2e8;font-size:.78rem;font-weight:700;letter-spacing:.05em}.heading h1{font:normal clamp(2.5rem,6vw,4rem)/1 Georgia,serif;letter-spacing:-.06em;margin:0 0 8px}.heading p{color:#c4cec7;font-size:.95rem;margin:0 0 36px}.form-card{background:#1a221e;border:1px solid #ffffff22;padding:32px;box-shadow:0 8px 24px #00000040}.field{display:block;margin:24px 0 0}.field label{display:block;font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#f6ae89;margin-bottom:8px}.field select,.field input[type="text"],.field textarea{width:100%;padding:14px 16px;border:1px solid #ffffff30;background:#252e28;color:#f8f2e8;font:1rem Georgia,serif;transition:border-color .2s}.field select:focus,.field input[type="text"]:focus,.field textarea:focus{outline:2px solid #f18a5c;outline-offset:2px;border-color:#f18a5c}.field select option{background:#1a221e;color:#f8f2e8}.field textarea{min-height:140px;resize:vertical}.error{padding:12px 16px;border-left:3px solid #ff6b5a;background:#2a1818;color:#ff9b8f;font-size:.85rem;margin-bottom:24px;line-height:1.35}.submit{width:100%;margin-top:32px;padding:16px 24px;border:0;background:#f18a5c;color:#101512;font:700 .95rem Arial,sans-serif;cursor:pointer;transition:transform .2s,background .2s}.submit:hover{background:#ffb08d;transform:translateY(-2px)}.submit:focus-visible{outline:2px solid #ffd2b8;outline-offset:3px}@media(max-width:480px){.shell{padding:32px 0 48px}.form-card{padding:24px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><a class="brand" href="{{ url_for('real.real_root') }}">Insta<em>Real</em></a><a class="back" href="{{ url_for('profile.profile_page') }}">Back to profile ↗</a></header>
    <section class="heading"><h1>Post a Real.</h1><p>Share a thought worth carrying with someone else.</p></section>
    <div class="form-card">
      {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="{{ url_for('post.post_reals') }}">
        <div class="field"><label for="category">Category</label><select id="category" name="category" required><option value="" selected disabled>Choose a category</option>{% for cat in categories %}<option value="{{ cat }}">{{ cat }}</option>{% endfor %}</select></div>
        <div class="field"><label for="title">Title</label><input id="title" name="title" type="text" maxlength="120" placeholder="Give your Real a title" required></div>
        <div class="field"><label for="content">Content</label><textarea id="content" name="content" maxlength="500" placeholder="Write something encouraging..." required></textarea></div>
        <button class="submit" type="submit">Post Real</button>
      </form>
    </div>
  </main>
</body>
</html>
