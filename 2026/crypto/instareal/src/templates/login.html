<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InstaReal / log in</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#17221f;background:#f4efe5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 12%,#f8c7a6 0 11%,transparent 30%),radial-gradient(circle at 92% 84%,#b7d8c8 0 13%,transparent 32%),#f4efe5}.shell{width:min(1120px,calc(100% - 48px));min-height:100vh;margin:auto;display:grid;grid-template-columns:1fr .8fr;gap:10vw;align-items:center;padding:32px 0}.brand{position:absolute;top:25px;color:#17221f;font:bold 1.65rem Georgia,serif;letter-spacing:-.07em;text-decoration:none}.brand em{color:#eb603b;font-style:normal}.intro{max-width:560px}.kicker{font:700 .75rem Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#eb603b}.intro h1{font:normal clamp(4rem,9vw,8rem)/.82 Georgia,serif;letter-spacing:-.08em;margin:20px 0 26px}.intro p{max-width:440px;font:1.15rem/1.45 Georgia,serif;color:#4f5c56}.panel{background:#fffaf0;border:1px solid #d6cec0;padding:34px;box-shadow:12px 14px 0 #e8d8c7;transform:rotate(-1.2deg)}.panel h2{font:normal 2.2rem/1 Georgia,serif;letter-spacing:-.05em;margin:0 0 8px}.panel-copy{margin:0 0 24px;color:#66716d;font-size:.9rem;line-height:1.4}.field{display:block;margin:18px 0 0;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.field input{display:block;width:100%;margin-top:8px;padding:14px;border:1px solid #c8c0b3;background:#f8f3e9;color:#17221f;font:16px Arial,sans-serif}.field input::placeholder{color:#8e867b}.field input:focus{outline:2px solid #eb603b;outline-offset:2px}.error{padding:10px 12px;border-left:3px solid #b83828;background:#f7d8cf;color:#8f2f24;font-size:.82rem;line-height:1.35}.submit{width:100%;margin-top:24px;padding:14px 20px;border:0;background:#17221f;color:#f8f3e8;font:700 .9rem Arial,sans-serif;cursor:pointer;transition:transform .2s,background .2s}.submit:hover{background:#eb603b;transform:translateY(-2px)}.submit:focus-visible{outline:2px solid #eb603b;outline-offset:3px}.foot{margin:22px 0 0;color:#66716d;font-size:.82rem}.foot a{color:#17221f;font-weight:700}.back{display:inline-block;margin-top:18px;color:#17221f;font-size:.8rem;font-weight:700;text-decoration:none;border-bottom:1px solid #17221f}@media(max-width:760px){.shell{display:block;padding:88px 0 48px}.intro{margin-bottom:48px}.intro h1{font-size:clamp(4rem,18vw,6.5rem)}.panel{transform:none;padding:26px}}
    .submit{border-radius:99px;transition:transform .2s,background .2s}.foot a{display:inline-flex;align-items:center;margin-left:4px;padding:8px 12px;border:1px solid #17221f;border-radius:99px;color:#17221f;text-decoration:none;font-weight:700;transition:transform .2s,background .2s,color .2s}.foot a:hover{background:#17221f;color:#f8f3e8;transform:translateY(-2px)}.foot a:focus-visible{outline:2px solid #eb603b;outline-offset:3px}
  </style>
</head>
<body>
  <main class="shell">
    <a class="brand" href="{{ url_for('real.real_root') }}">Insta<em>Real</em></a>
    <section class="intro"><div class="kicker">Welcome back</div><h1>Keep the<br>good words<br>close.</h1><p>Scroll through the quotes that help you begin again, keep going, and see things differently.</p></section>
    <section class="panel"><h2>Log in.</h2><p class="panel-copy">Return to your saved perspective and inspirational Reals.</p>{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}<form method="post" action="{{ url_for('auth.login') }}"><label class="field" for="username">Username<input id="username" name="username" autocomplete="username" placeholder="Enter your username" required></label><label class="field" for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></label><button class="submit" type="submit">Continue to InstaReal</button></form><p class="foot">New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></p></section>
  </main>
</body>
</html>
